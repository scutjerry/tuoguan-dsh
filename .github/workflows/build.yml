name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows-build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test
        shell: powershell
        run: ./tests/smoke-test.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: TuoguanDSH-windows
          path: |
            dist/TuoguanDSH.exe
            dist/dsh-fish.ico
            install.ps1
            uninstall.ps1
            README.md

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-build-and-test
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build package
        shell: powershell
        run: ./build.ps1
      - name: Verify tag and publish artifacts
        shell: powershell
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ("v$packageVersion" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match package version v$packageVersion."
          }
          node ./scripts/check-dist.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
