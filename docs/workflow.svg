<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="310" viewBox="0 0 1120 310" role="img" aria-label="托管 DSH 工作流程">
  <defs>
    <style>
      .title{font:700 24px 'Microsoft YaHei UI','Segoe UI',sans-serif;fill:#0f172a}
      .text{font:600 17px 'Microsoft YaHei UI','Segoe UI',sans-serif;fill:#0f172a}
      .sub{font:400 14px 'Microsoft YaHei UI','Segoe UI',sans-serif;fill:#475569}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:2}
      .blue{fill:#eff6ff;stroke:#60a5fa}.green{fill:#f0fdf4;stroke:#4ade80}.gray{fill:#f8fafc}.red{fill:#fef2f2;stroke:#f87171}
      .arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#head)}
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1120" height="310" fill="#f8fafc" rx="18"/>
  <text x="40" y="48" class="title">托管 DSH：手动启动、后台常驻、托盘退出</text>
  <rect x="40" y="88" width="220" height="116" rx="16" class="box blue"/>
  <text x="150" y="130" text-anchor="middle" class="text">点击“托管 DSH”</text><text x="150" y="158" text-anchor="middle" class="sub">桌面或开始菜单快捷方式</text>
  <path d="M265 146 H335" class="arrow"/>
  <rect x="340" y="88" width="210" height="116" rx="16" class="box gray"/>
  <text x="445" y="130" text-anchor="middle" class="text">TuoguanDSH.exe</text><text x="445" y="158" text-anchor="middle" class="sub">显示中文托盘菜单</text>
  <path d="M555 146 H625" class="arrow"/>
  <rect x="630" y="88" width="210" height="116" rx="16" class="box green"/>
  <text x="735" y="130" text-anchor="middle" class="text">隐藏启动 DSH</text><text x="735" y="158" text-anchor="middle" class="sub">直接托管 node.exe</text>
  <path d="M845 146 H915" class="arrow"/>
  <rect x="920" y="88" width="160" height="116" rx="16" class="box red"/>
  <text x="1000" y="130" text-anchor="middle" class="text">完全退出</text><text x="1000" y="158" text-anchor="middle" class="sub">停止托盘自有 DSH</text>
  <text x="40" y="260" class="sub">不会注册开机启动、Windows 服务或计划任务；已有外部 DSH 占用 3080 时不会被终止或重启。</text>
</svg>
