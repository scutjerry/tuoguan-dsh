<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-label="托管 DSH 托盘菜单示意图">
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".18"/></filter></defs>
  <rect width="760" height="500" fill="#e2e8f0"/>
  <rect x="170" y="42" width="420" height="410" rx="12" fill="#fff" filter="url(#shadow)"/>
  <rect x="170" y="42" width="44" height="410" rx="12" fill="#f8fafc"/>
  <g font-family="Microsoft YaHei UI,Segoe UI,sans-serif" font-size="19" fill="#0f172a">
    <text x="230" y="91" font-weight="700" fill="#166534">●  状态：DSH 正在运行（由本托盘管理）</text>
    <line x1="188" y1="116" x2="572" y2="116" stroke="#e2e8f0"/>
    <text x="230" y="157">▶  启动 DSH 服务</text>
    <rect x="214" y="178" width="360" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="230" y="212">🌐  打开 DSH 网页</text>
    <text x="230" y="269">↻  重启托盘管理的 DSH</text>
    <line x1="188" y1="300" x2="572" y2="300" stroke="#e2e8f0"/>
    <text x="230" y="343">▤  查看运行日志</text>
    <text x="230" y="401" fill="#b91c1c">✕  完全退出托盘（停止托盘自有 DSH）</text>
  </g>
  <text x="380" y="480" text-anchor="middle" font-family="Microsoft YaHei UI,Segoe UI,sans-serif" font-size="15" fill="#475569">右键托盘中的透明黑鱼图标即可打开中文菜单</text>
</svg>
